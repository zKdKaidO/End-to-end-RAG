x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILES:-7}

services:
  postgres:
    build:
      context: ../postgres
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [backend]
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7.4.10-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [backend]
    restart: unless-stopped
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes: [minio_data:/data]
    networks: [backend]
    restart: unless-stopped
    logging: *default-logging

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >-
      /bin/sh -c "mc alias set target http://minio:9000
      $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY} &&
      mc mb target/$${MINIO_BUCKET} --ignore-existing"
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
      MINIO_BUCKET: ${MINIO_BUCKET:-documents}
    networks: [backend]

  ollama:
    image: ollama/ollama:0.32.15
    volumes:
      - ${OLLAMA_MODELS_HOST:?OLLAMA_MODELS_HOST must point to a pre-provisioned model store}:/root/.ollama
    networks: [inference]
    restart: unless-stopped
    logging: *default-logging

  provision-model:
    image: ollama/ollama:0.32.15
    profiles: ["provisioning"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: pull qwen3.5:9b
    depends_on: [ollama]
    networks: [inference]

  db-migrate:
    build:
      context: ..
    command: >-
      sh -c "python -m app.deployment.cli preflight &&
      alembic upgrade head &&
      python -m app.deployment.cli migration-check"
    env_file: ${PRODUCTION_ENV_FILE:-../.env.production}
    environment:
      DEPLOYMENT_PROFILE: production
      AUTH_COOKIE_SECURE: "true"
      SECURITY_HSTS_ENABLED: "true"
      RECOVERY_CONTROL_DIR: /recovery-control
      BACKUP_DESTINATION: /backups
    volumes:
      - ${RECOVERY_CONTROL_HOST:?RECOVERY_CONTROL_HOST must be on the recovery failure domain}:/recovery-control
      - ${BACKUP_DESTINATION_HOST:?BACKUP_DESTINATION_HOST must be on a separate protected failure domain}:/backups
    depends_on:
      postgres: {condition: service_healthy}
    networks: [backend, inference]

  api:
    build:
      context: ..
    command: >-
      sh -c 'uvicorn app.main:app --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips "$${TRUSTED_PROXY_CIDRS}"'
    env_file: ${PRODUCTION_ENV_FILE:-../.env.production}
    environment:
      DEPLOYMENT_PROFILE: production
      AUTH_COOKIE_SECURE: "true"
      SECURITY_HSTS_ENABLED: "true"
      OLLAMA_BASE_URL: http://ollama:11434
      RECOVERY_CONTROL_DIR: /recovery-control
      BACKUP_DESTINATION: /backups
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 18
    volumes:
      - model_cache:/root/.cache/huggingface
      - ${RECOVERY_CONTROL_HOST:?RECOVERY_CONTROL_HOST required}:/recovery-control
      - ${BACKUP_DESTINATION_HOST:?BACKUP_DESTINATION_HOST required}:/backups
    depends_on:
      db-migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
      ollama: {condition: service_started}
    networks: [edge, backend, inference]
    restart: unless-stopped
    logging: *default-logging

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: /api
    networks: [edge]
    restart: unless-stopped
    logging: *default-logging

  edge:
    image: nginx:1.29.1-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERTIFICATE_HOST_PATH:?TLS certificate required}:/etc/nginx/tls/tls.crt:ro
      - ${TLS_PRIVATE_KEY_HOST_PATH:?TLS private key required}:/etc/nginx/tls/tls.key:ro
    depends_on:
      api: {condition: service_healthy}
      frontend: {condition: service_started}
    networks: [edge]
    restart: unless-stopped
    logging: *default-logging

  worker:
    build: {context: ..}
    command: python -m app.worker_main
    env_file: ${PRODUCTION_ENV_FILE:-../.env.production}
    environment:
      DEPLOYMENT_PROFILE: production
      AUTH_COOKIE_SECURE: "true"
      SECURITY_HSTS_ENABLED: "true"
      RECOVERY_CONTROL_DIR: /recovery-control
    volumes:
      - ${RECOVERY_CONTROL_HOST:?RECOVERY_CONTROL_HOST required}:/recovery-control
    depends_on:
      db-migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    networks: [backend]
    restart: unless-stopped
    logging: *default-logging

  processing-worker:
    build: {context: ..}
    command: python -m app.processing_worker_main
    env_file: ${PRODUCTION_ENV_FILE:-../.env.production}
    environment:
      DEPLOYMENT_PROFILE: production
      AUTH_COOKIE_SECURE: "true"
      SECURITY_HSTS_ENABLED: "true"
    depends_on:
      db-migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 256
    networks: [backend]
    restart: unless-stopped
    logging: *default-logging

  indexing-worker:
    build: {context: ..}
    command: python -m app.indexing_worker_main
    env_file: ${PRODUCTION_ENV_FILE:-../.env.production}
    environment:
      DEPLOYMENT_PROFILE: production
      AUTH_COOKIE_SECURE: "true"
      SECURITY_HSTS_ENABLED: "true"
      EMBEDDING_DEVICE: cpu
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes: [model_cache:/root/.cache/huggingface]
    depends_on:
      db-migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 512
    networks: [backend]
    restart: unless-stopped
    logging: *default-logging

  deployment-tool:
    build: {context: ..}
    profiles: ["operations"]
    command: python -m app.deployment.cli --help
    env_file: ${PRODUCTION_ENV_FILE:-../.env.production}
    environment:
      DEPLOYMENT_PROFILE: production
      AUTH_COOKIE_SECURE: "true"
      SECURITY_HSTS_ENABLED: "true"
      OLLAMA_BASE_URL: http://ollama:11434
      RECOVERY_CONTROL_DIR: /recovery-control
      BACKUP_DESTINATION: /backups
    volumes:
      - ${RECOVERY_CONTROL_HOST:?RECOVERY_CONTROL_HOST required}:/recovery-control
      - ${BACKUP_DESTINATION_HOST:?BACKUP_DESTINATION_HOST required}:/backups
    networks: [backend, inference]

volumes:
  postgres_data:
  minio_data:
  model_cache:

networks:
  edge:
  backend:
    internal: true
  inference:
    internal: true
