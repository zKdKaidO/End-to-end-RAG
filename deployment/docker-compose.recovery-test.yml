name: rag_recovery_v1

services:
  postgres:
    build:
      context: ../postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      POSTGRES_DB: ${DB_NAME:-rag_db}
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: [recovery_postgres:/var/lib/postgresql/data]
    networks: [backend]

  redis:
    image: redis:7.4.10-alpine
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: [recovery_redis:/data]
    networks: [backend]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY required}
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: [recovery_minio:/data]
    networks: [backend]

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >-
      /bin/sh -c "mc alias set test http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY} &&
      mc mb test/$${MINIO_BUCKET} --ignore-existing"
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY required}
      MINIO_BUCKET: ${MINIO_BUCKET:-documents}
    networks: [backend]

  db-migrate:
    image: rag-api:latest
    command: >-
      sh -c "python -m app.deployment.cli preflight && alembic upgrade head &&
      python -m app.deployment.cli migration-check"
    env_file: ../.env
    environment: &recovery-environment
      APP_ENV: recovery-test
      DEPLOYMENT_PROFILE: development
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-rag_db}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      RECOVERY_CONTROL_DIR: /recovery-control
      BACKUP_DESTINATION: /backups
      EXPECTED_MODEL_DIGEST: 6488c96fa5faab64bb65cbd30d4289e20e6130ef535a93ef9a49f42eda893ea7
      RELEASE_ID: recovery-test-v1
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ..:/app
      - recovery_control:/recovery-control
      - recovery_backups:/backups
    depends_on:
      postgres: {condition: service_healthy}
    networks: [backend, provider]

  api:
    image: rag-api:latest
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: ../.env
    environment:
      <<: *recovery-environment
      AUTH_COOKIE_SECURE: "false"
      AUTH_TRUSTED_ORIGINS: http://localhost:15173
      DEBUG_UI_ENABLED: "true"
      EVALUATION_UI_ENABLED: "true"
    ports: ["127.0.0.1:18001:8000"]
    volumes:
      - ..:/app
      - recovery_control:/recovery-control
      - recovery_backups:/backups
      - model_cache:/root/.cache/huggingface
    depends_on:
      db-migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [backend, provider]

  worker:
    image: rag-api:latest
    command: python -m app.worker_main
    env_file: ../.env
    environment: *recovery-environment
    volumes:
      - ..:/app
      - recovery_control:/recovery-control
    depends_on:
      db-migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    networks: [backend]

  processing-worker:
    image: rag-api:latest
    command: python -m app.processing_worker_main
    env_file: ../.env
    environment: *recovery-environment
    depends_on:
      db-migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    networks: [backend]

  indexing-worker:
    image: rag-api:latest
    command: python -m app.indexing_worker_main
    env_file: ../.env
    environment:
      <<: *recovery-environment
      EMBEDDING_DEVICE: cpu
    volumes: [model_cache:/root/.cache/huggingface]
    depends_on:
      db-migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    networks: [backend]

  deployment-tool:
    image: rag-api:latest
    profiles: ["operations"]
    command: python -m app.deployment.cli --help
    env_file: ../.env
    environment: *recovery-environment
    volumes:
      - ..:/app
      - recovery_control:/recovery-control
      - recovery_backups:/backups
    networks: [backend, provider]

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: http://localhost:18001
    ports: ["127.0.0.1:15173:80"]
    depends_on:
      api: {condition: service_healthy}
    networks: [provider]

volumes:
  recovery_postgres:
    name: rag_recovery_v1_postgres
  recovery_redis:
    name: rag_recovery_v1_redis
  recovery_minio:
    name: rag_recovery_v1_minio
  recovery_control:
    name: rag_recovery_v1_control
  recovery_backups:
    name: rag_recovery_v1_backups
  model_cache:
    name: rag_recovery_v1_model_cache

networks:
  backend:
    internal: true
  provider:
