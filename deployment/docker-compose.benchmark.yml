services:
  benchmark-postgres:
    build:
      context: ../postgres
    environment:
      POSTGRES_USER: ${DB_USER:?copy .env.benchmark.example to .env.benchmark}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - benchmark_postgres_data:/var/lib/postgresql/data
    networks: [benchmark_backend]

  benchmark-redis:
    image: redis:7.4.10-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - benchmark_redis_data:/data
    networks: [benchmark_backend]

  benchmark-minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - benchmark_minio_data:/data
    networks: [benchmark_backend]

  benchmark-minio-init:
    image: minio/mc
    depends_on:
      benchmark-minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "mc alias set benchmark http://benchmark-minio:9000
      ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set} &&
      mc mb benchmark/${MINIO_BUCKET:?MINIO_BUCKET must be set} --ignore-existing"
    networks: [benchmark_backend]

  benchmark-migrate:
    build:
      context: ..
    command: >-
      sh -c "python -m app.deployment.cli preflight && alembic upgrade head &&
      python -m app.deployment.cli migration-check"
    env_file: ../.env.benchmark
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ../:/app
      - benchmark_e5_cache:/root/.cache/huggingface:ro
    depends_on:
      benchmark-postgres:
        condition: service_healthy
      benchmark-minio-init:
        condition: service_completed_successfully
    networks: [benchmark_backend]

  benchmark-seed:
    build:
      context: ..
    command: python -m evaluation.benchmark.seed
    env_file: ../.env.benchmark
    volumes:
      - ../:/app
    depends_on:
      benchmark-migrate:
        condition: service_completed_successfully
      benchmark-minio-init:
        condition: service_completed_successfully
    networks: [benchmark_backend]

  benchmark-api:
    build:
      context: ..
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: ../.env.benchmark
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ../:/app
      - benchmark_e5_cache:/root/.cache/huggingface:ro
    depends_on:
      benchmark-seed:
        condition: service_completed_successfully
      benchmark-redis:
        condition: service_healthy
    networks: [benchmark_backend]

  benchmark-worker:
    profiles: ["workers"]
    build:
      context: ..
    command: python -m app.worker_main
    env_file: ../.env.benchmark
    volumes:
      - ../:/app
    depends_on:
      benchmark-seed:
        condition: service_completed_successfully
      benchmark-redis:
        condition: service_healthy
    networks: [benchmark_backend]

  benchmark-processing-worker:
    profiles: ["workers"]
    build:
      context: ..
    command: python -m app.processing_worker_main
    env_file: ../.env.benchmark
    volumes:
      - ../:/app
      - benchmark_e5_cache:/root/.cache/huggingface:ro
    depends_on:
      benchmark-seed:
        condition: service_completed_successfully
      benchmark-redis:
        condition: service_healthy
    networks: [benchmark_backend]

  benchmark-indexing-worker:
    profiles: ["workers"]
    build:
      context: ..
    command: python -m app.indexing_worker_main
    env_file: ../.env.benchmark
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ../:/app
      - benchmark_e5_cache:/root/.cache/huggingface:ro
    depends_on:
      benchmark-seed:
        condition: service_completed_successfully
      benchmark-redis:
        condition: service_healthy
    networks: [benchmark_backend]

volumes:
  benchmark_postgres_data:
  benchmark_redis_data:
  benchmark_minio_data:
  benchmark_e5_cache:
    external: true
    name: ${BENCHMARK_E5_CACHE_VOLUME:?BENCHMARK_E5_CACHE_VOLUME must name the read-only canonical E5 cache volume}

networks:
  benchmark_backend:
    internal: true
