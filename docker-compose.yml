services:
  postgres:
    build:
      context: ./postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${DB_NAME:-rag_db}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    restart: unless-stopped

  redis:
    image: redis:7.4.10-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks: [backend]
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - minio_data:/data
    networks: [backend]
    restart: unless-stopped

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set} ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set};
      mc mb myminio/${MINIO_BUCKET:-documents} --ignore-existing;
      "
    networks: [backend]

  migrate:
    build: .
    command: >-
      sh -c "python -m app.deployment.cli preflight &&
      alembic upgrade head &&
      python -m app.deployment.cli migration-check"
    env_file: .env
    environment:
      RECOVERY_CONTROL_DIR: /recovery-control
      BACKUP_DESTINATION: /backups
    volumes:
      - .:/app
      - recovery_control:/recovery-control
      - backup_drill_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8001:8000"
    env_file: .env
    environment:
      DEBUG_UI_ENABLED: ${DEBUG_UI_ENABLED:-false}
      EVALUATION_UI_ENABLED: ${EVALUATION_UI_ENABLED:-false}
      DEBUG_UI_ORIGINS: ${DEBUG_UI_ORIGINS:-http://localhost:5173}
      # This compose profile serves plain HTTP for local development only.
      # Deployed environments must set AUTH_COOKIE_SECURE=true.
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      RECOVERY_CONTROL_DIR: /recovery-control
      BACKUP_DESTINATION: /backups
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - model_cache:/root/.cache/huggingface
      - recovery_control:/recovery-control
      - backup_drill_data:/backups
    networks: [backend, provider]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8001}
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api
    networks: [provider]
    restart: unless-stopped

  worker:
    build: .
    # Note: Placeholder worker entrypoint for Phase 2.
    command: python -m app.worker_main
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - recovery_control:/recovery-control
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    restart: unless-stopped
    networks: [backend]

  processing-worker:
    build: .
    command: python -m app.processing_worker_main
    env_file: .env
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - model_cache:/root/.cache/huggingface
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 256
    restart: unless-stopped
    networks: [backend]

  indexing-worker:
    build: .
    command: python -m app.indexing_worker_main
    env_file: .env
    environment:
      - EMBEDDING_DEVICE=cpu
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - model_cache:/root/.cache/huggingface
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 512
    restart: unless-stopped
    networks: [backend]

  deployment-tool:
    build: .
    profiles: ["operations"]
    command: python -m app.deployment.cli --help
    env_file: .env
    environment:
      RECOVERY_CONTROL_DIR: /recovery-control
      BACKUP_DESTINATION: /backups
    volumes:
      - .:/app
      - recovery_control:/recovery-control
      - backup_drill_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [backend, provider]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  model_cache:
  recovery_control:
  backup_drill_data:

networks:
  backend:
    internal: true
  provider:
